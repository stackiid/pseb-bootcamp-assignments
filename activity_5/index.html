<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b43" />
    <title>CSS Penguin</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main class="winter-scene" aria-label="Animated CSS penguin">
      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <div class="stars" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="snow-layer snow-back" aria-hidden="true"></div>
      <div class="snow-layer snow-mid" aria-hidden="true"></div>
      <div class="snow-layer snow-front" aria-hidden="true"></div>

      <div class="penguin" aria-label="Penguin">
        <div class="penguin-bottom">
          <div class="right-hand"></div>
          <div class="left-hand"></div>
          <div class="right-feet"></div>
          <div class="left-feet"></div>
        </div>
        <div class="penguin-top">
          <div class="right-cheek"></div>
          <div class="left-cheek"></div>
          <div class="belly"></div>
          <div class="right-eye"><span class="sparkle"></span></div>
          <div class="left-eye"><span class="sparkle"></span></div>
          <div class="blush-right"></div>
          <div class="blush-left"></div>
          <div class="beak-top"></div>
          <div class="beak-bottom"></div>
          <div class="laugh-mouth"></div>
        </div>
      </div>

      <div class="snow-ground" aria-hidden="true"></div>
      <div class="penguin-shadow" aria-hidden="true"></div>
    </main>
  </body>
</html>
